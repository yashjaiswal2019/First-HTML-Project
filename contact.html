<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="Author" content="Yash Jayasaval">
        <meta name="description" content="LTS Contact Us from.">

        <title>LTS Contact From</title>

        <link rel="stylesheet" href="css/style.css">
        <link rel="icon" href="favicon.ico" type="img/X-icon">
    </head>

    <body>
        <header>
            <h1>Contact Us</h1>
        
            <nav aria-label="contact-navigation">
                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="index.html#about">About LTS</a>
                    </li>
                    <li>
                        <a href="index.html#menu">Our Menu</a>
                    </li>
                    <li>
                        <a href="hours.html">Store Hours</a>
                    </li>
                </ul>
            </nav>
        
            <figure>
                <img src="img/tacos_close_up_400x260.png" alt="Tacos Close up" title="Tacos Colse up">
                <figcaption>Little Taco Shop Tacos</figcaption>
            </figure>
        </header>
        
        <main>
            <article id="contact">
                <h2>Our Contact Us From📜</h2>
            
                <fieldset>
                    <legend>Send Us a Message</legend>
                    <form action="https://httpbin.org/post" method="post" id="contactForm">
                        <p>
                            <label for="name">Name:</label>
                            <input type="text" name="name" id="name" placeholder="Your Name" autocomplete="on" required autofocus>
                        </p>
                        <p>
                            <label for="email">E-mail:</label>
                            <input type="email" name="email" id="email" placeholder="Your E-mail" autocomplete="on" required>
                        </p>
                        <p>
                            <label for="message">Your Message for us:</label>
                            <br>
                            <textarea name="message" id="message" cols="30" rows="10" placeholder="Write a Message for us"></textarea>
                        </p>
                    </form>
                </fieldset>
            
                <button type="submit" form="contactForm">Send</button>
                <button type="reset" form="contactForm">Reset</button>
            </article>

            <section id="address">
                <h2>Our Location📍</h2>
                <address>
                    555 Taco Temptation Lane, Suite T
                    <br>
                    Kansas City, MO 55555-55555
                </address>
            
                <p>
                    <em>Phone: <a href="tel:5555555555">555-555-555</a></em>
                </p>
            </section>
        </main>
        
        <footer>
            <a href="#">Back to Top</a>

            <hr>

            <p>Copyright &copy; The Little Taco Shop</p>
        </footer>

    </body>
</html>
